# Builds and tests Copperview on Linux, macOS and Windows for every push and
# pull request, and keeps the installer for each as a download. A tag like
# v0.2.2 also puts the installers on a GitHub release.
name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# A newer push to the same branch makes an older, unfinished run pointless.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # The oldest Ubuntu GitHub still offers, so the Linux program also
          # runs on older systems than the newest.
          - name: Linux
            os: ubuntu-22.04
          - name: macOS
            os: macos-latest
          - name: Windows
            os: windows-latest

    steps:
      - uses: actions/checkout@v4

      # The compiler named in rust-toolchain.toml, so every machine builds with the same one.
      - name: Install the pinned Rust
        shell: bash
        run: |
          rustup toolchain install
          rustc --version
          cargo --version

      # The Mac app is built for Apple Silicon and Intel both.
      - name: Add the Intel and Apple Silicon targets
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Cache built libraries
        uses: Swatinem/rust-cache@v2

      # Mostly the window libraries load these when the program runs, but
      # having them here keeps a build from stopping on a missing header.
      - name: Install Linux build libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev libgl1-mesa-dev

      - name: Test
        run: cargo test --locked

      - name: Build
        run: cargo build --release --locked

      # Each system keeps what it would hand to a person: the Linux installer,
      # the Mac app, the Windows installer and program.
      - name: Package for Linux
        if: runner.os == 'Linux'
        run: sh make-installer.sh

      - name: Package for macOS
        if: runner.os == 'macOS'
        run: sh make-macos-app.sh --universal

      # Inno Setup builds the installer; the runner may already have it.
      - name: Package for Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
          ./make-windows-installer.ps1

      - name: Upload the Linux installer
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: copperview-linux
          path: dist/install-copperview-*.sh
          if-no-files-found: error

      - name: Upload the Mac app
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: copperview-macos
          path: dist/Copperview-*-macos.dmg
          if-no-files-found: error

      - name: Upload the Windows program
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: copperview-windows
          path: |
            dist/copperview.exe
            dist/copperview-setup-*.exe
          if-no-files-found: error

  # A tag like v0.2.2: the installers from the three builds go on a release.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true
      - name: Make the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" installers/* --repo "$GITHUB_REPOSITORY" \
            --title "Copperview ${GITHUB_REF_NAME#v}" --generate-notes
